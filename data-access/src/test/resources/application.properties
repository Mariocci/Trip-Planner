# Test Database Configuration - PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/tripplanner
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=tripplanner_user
spring.datasource.password=tripplanner_pass

# JPA/Hibernate Configuration for Tests
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable data.sql initialization in tests
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# Logging Configuration for Tests
logging.level.com.tripplanner=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
