# Test Database Configuration - PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/tripplanner
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=tripplanner_user
spring.datasource.password=tripplanner_pass

# JPA/Hibernate Configuration for Tests
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable data.sql initialization in tests
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# Auth0 JWT Validation Configuration (for tests)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-dhh7rrc7jjza3i2w.eu.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=https://tripplanner-api

# Auth0 Domain and Client ID (for tests)
auth0.domain=dev-dhh7rrc7jjza3i2w.eu.auth0.com
auth0.clientId=YeQ95SUX9ck94P6So4ixkT0sli5WAnUR

# JWT Configuration for Tests
jwt.secret=TEST_JWT_SECRET_KEY_FOR_TESTING_ONLY
jwt.expiration=86400000

# Google Maps API Configuration (for tests - can be mocked)
google.maps.api.key=TEST_API_KEY

# Logging Configuration for Tests
logging.level.com.tripplanner=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security=WARN
