       b# Server Configuration
server.port=8080

# Database Configuration - PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/tripplanner
spring.datasource.username=tripplanner_user
spring.datasource.password=tripplanner_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Initialize database with data.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Auth0 JWT Validation Configuration (for SPA)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-dhh7rrc7jjza3i2w.eu.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=https://tripplanner-api

# Auth0 Domain and Client ID (for frontend)
auth0.domain=dev-dhh7rrc7jjza3i2w.eu.auth0.com
auth0.clientId=YeQ95SUX9ck94P6So4ixkT0sli5WAnUR

# JWT Configuration
jwt.secret=YOUR_JWT_SECRET_KEY_CHANGE_THIS_IN_PRODUCTION
jwt.expiration=86400000

